name: Deploy to GitHub Pages

# Despliega también desde la rama de desarrollo actual para poder probar el
# juego en GitHub Pages antes de mergear a main. Quitar esa rama del trigger
# (dejando solo "main") cuando se mergee de forma definitiva.
on:
  push:
    branches: [main, claude/rally-game-architecture-dlnzzx]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
