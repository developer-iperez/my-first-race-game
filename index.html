<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Rally 90s</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        height: 100%;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app canvas {
        image-rendering: pixelated;
      }

      /* Controles táctiles (móvil/tablet sin teclado físico) */
      .touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .touch-controls__cluster {
        position: absolute;
        bottom: 24px;
        display: flex;
        gap: 12px;
      }
      .touch-controls__cluster--steer {
        left: 20px;
      }
      .touch-controls__cluster--pedals {
        right: 20px;
        flex-direction: column;
      }
      .touch-btn {
        pointer-events: auto;
        touch-action: none;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 24px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .touch-btn.is-active {
        background: rgba(255, 204, 0, 0.55);
        border-color: #ffcc00;
      }
      .touch-btn--handbrake {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        width: 56px;
        height: 56px;
        font-size: 20px;
        background: rgba(139, 26, 26, 0.35);
      }
      .touch-btn--handbrake.is-active {
        background: rgba(255, 60, 60, 0.6);
        border-color: #ff3c3c;
      }

      /* En escritorio (ratón, sin touch) los controles se atenúan: el
         teclado es el input principal, pero siguen siendo clicables. */
      @media (hover: hover) and (pointer: fine) {
        .touch-controls {
          opacity: 0.35;
        }
      }

      /* Menú de ajustes */
      .settings-btn {
        position: fixed;
        top: max(12px, env(safe-area-inset-top, 0px));
        right: 12px;
        z-index: 20;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
      }
      .settings-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
      }
      .settings-overlay.is-open {
        display: flex;
      }
      .settings-panel {
        width: min(320px, 88vw);
        background: #1a1a1a;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 16px;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      .settings-panel__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .settings-panel__header h2 {
        margin: 0;
        font-size: 18px;
      }
      .settings-close {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 16px;
      }
      .settings-row__label {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 8px;
      }
      .settings-row__options {
        display: flex;
        gap: 8px;
      }
      .settings-option {
        flex: 1;
        padding: 10px 4px;
        border-radius: 6px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 14px;
      }
      .settings-option.is-selected {
        background: rgba(255, 204, 0, 0.4);
        border-color: #ffcc00;
      }

      /* El circuito es panorámico (F3: se ve completo, sin scroll): en
         vertical el canvas queda diminuto. En móvil/tablet (pointer: coarse)
         se pide girar el dispositivo en vez de jugar así. */
      #rotate-hint {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #app,
        .touch-controls,
        .settings-btn,
        .settings-overlay {
          display: none;
        }
        #rotate-hint {
          display: flex;
          position: fixed;
          inset: 0;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          color: #fff;
          font-family: system-ui, sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate-hint .icon {
          font-size: 48px;
          animation: rotate-hint-spin 1.8s ease-in-out infinite;
        }
        @keyframes rotate-hint-spin {
          0%, 100% { transform: rotate(0deg); }
          50% { transform: rotate(90deg); }
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-hint">
      <div class="icon">🔄</div>
      <p>Gira el dispositivo para jugar en horizontal</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
